name: unex_play
description: Aplicativo Flutter de streaming IPTV para Android e Android TV.
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
